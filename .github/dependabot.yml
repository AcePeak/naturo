version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    # All development happens on `develop`; `main` only receives releases.
    # Without this, dependabot targets the default branch (main) and develop's
    # pins silently age (see #1295).
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 10
    ignore:
      # naturo's MCP server is built on the mcp 1.x API (`mcp.server.fastmcp`),
      # which mcp 2.0 removed/renamed. Adopting mcp 2.x is a deliberate code
      # migration tracked in #1317 (target: standalone fastmcp v2), not a pin
      # bump — the cap-widening PR fails CI. Ignore the major until #1317 lands;
      # patch/minor updates within 1.x are still allowed.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    # See note above (#1295): keep develop's CI action pins current.
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5
